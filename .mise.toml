[tools]
flutter = "3.50.0"

[tasks.setup]
description = "Setup Repository"
depends = []
run = """
chmod +x scripts/setup.sh
scripts/setup.sh
"""

[tasks."armyknife:async_notify2:publish"]
description = "Publish async_notify2 to pub.dev"
usage = '''
flag "--dry-run" help="Validate package without uploading to pub.dev"
'''
run = """
dart pub -C async_notify2 publish ${usage_dry_run:+--dry-run}
"""


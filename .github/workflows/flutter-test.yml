name: Flutter Test

on:
  push:
    branches:
      - main
      - develop
      - feature/id/*/*

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        package:
          - async_notify2
          - dartx
          - driftx
          - exceptions
          - flutter_riverpod_watch_plus
          - flutter_testx
          - flutterx
          - future_context2
          - future_context2_hooks
          - logger
          - logger_flutter
          - logger_grinder
          - riverpod_container_async
          - riverpod_container_async_test
          - riverpodx
          - route_lifecycle_detector
          - state_stream
          - state_stream_riverpod
          - streams
          - task_queue
          - test_context
          - time
          - yamlx

    steps:
      # 最初にリポジトリをチェックアウトする
      - name: checkout repository
        uses: actions/checkout@v7

      # mise を使った開発環境のセットアップ
      - name: Setup development environment with mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.6.14

      # Flutterをインストールして依存関係を取得する
      - name: install flutter
        uses: ./.github/actions/install-flutter

      # テスト
      - name: flutter test - ${{ matrix.package }}
        run: |
          cp pubspec.yaml.template pubspec.yaml
          cd ${{ matrix.package }}
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
          dart format --set-exit-if-changed ./lib/
          dart format --set-exit-if-changed ./test/
          flutter test ./test/

name: Flutter Test

on:
  push:
    branches:
      - main
      - develop
      - feature/id/*/*

jobs:
  test:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        package:
          - async_notify2
          - dartx
          - driftx
          - exceptions
          - flutter_riverpod_watch_plus
          - flutter_testx
          - flutterx
          - future_context2
          - future_context2_hooks
          - logger
          - logger_flutter
          - logger_grinder
          - riverpod_container_async
          - riverpod_container_async_test
          - riverpod_container_builder
          - riverpodx
          - route_lifecycle_detector
          - state_stream
          - state_stream_riverpod
          - streams
          - task_queue
          - test_context
          - time
          - yamlx

    steps:
      # 最初にリポジトリをチェックアウトする
      - name: checkout repository
        uses: actions/checkout@v7

      # mise で .mise.toml のツール（Flutter 3.50.0）を入れる
      - name: install tools (mise)
        uses: jdx/mise-action@v5

      # 導入された Flutter 版をログに残す（ローカルと CI の突合用）
      - name: show flutter version
        run: |
          echo "flutter version: $(flutter --version)"
          echo "flutter path: $(which flutter)"
          echo "dart version: $(dart --version)"
          echo "dart path: $(which dart)"

      # テスト
      - name: flutter test - ${{ matrix.package }}
        run: |
          cp pubspec.yaml.template pubspec.yaml
          cd ${{ matrix.package }}
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
          dart format --set-exit-if-changed ./lib/
          dart format --set-exit-if-changed ./test/
          flutter test ./test/
